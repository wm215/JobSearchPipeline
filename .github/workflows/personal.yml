name: Personal Automations

on:
  schedule:
    # 7:30 AM ET = 11:30 UTC — sends the morning brief.
    # WHOOP write was removed 2026-05-05: dual-runner token rotation kept
    # killing the cron. Morning brief reads WHOOP from the sheet (populated
    # by the local whoop-mcp on the laptop) and degrades gracefully if empty.
    - cron: "30 11 * * *"
  # Manual trigger re-runs the same scheduled morning brief on demand.
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SQLite job DB from cache (read-only)
        uses: actions/cache@v4
        with:
          path: data/job_pipeline.db
          key: job-db-readonly-${{ github.run_id }}
          restore-keys: |
            job-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Gmail OAuth token
        run: |
          python - <<'PY'
          import base64, os
          data = base64.b64decode(os.environ["GMAIL_TOKEN_B64"])
          with open(os.path.expanduser("~/gmail_token.pickle"), "wb") as f:
              f.write(data)
          PY
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}

      - name: Run morning brief (unified email)
        env:
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          SHEETS_TOKEN_B64: ${{ secrets.SHEETS_TOKEN_B64 }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH=. python health/morning_brief.py

      - name: Healthcheck ping
        if: success() && env.HEALTHCHECK_PERSONAL_URL != ''
        env:
          HEALTHCHECK_PERSONAL_URL: ${{ secrets.HEALTHCHECK_PERSONAL_URL }}
        run: curl -fsS --retry 3 -o /dev/null "$HEALTHCHECK_PERSONAL_URL" || echo "ping failed (non-fatal)"
