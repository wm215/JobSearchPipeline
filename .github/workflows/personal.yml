name: Personal Automations

on:
  schedule:
    # 7:30 AM ET = 11:30 UTC — fires both jobs in parallel:
    #   1. WHOOP daily   → updates the WHOOP history tab (feeds Dashboard tab)
    #   2. Morning brief → unified email (job picks + follow-ups + LinkedIn,
    #                      tone-modulated by today's WHOOP recovery)
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "Which to run"
        required: true
        default: "morning_brief"
        type: choice
        options: [morning_brief, whoop, linkedin, all]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SQLite job DB from cache (read-only)
        uses: actions/cache@v4
        with:
          path: data/job_pipeline.db
          key: job-db-readonly-${{ github.run_id }}
          restore-keys: |
            job-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Gmail OAuth token
        run: |
          python - <<'PY'
          import base64, os
          data = base64.b64decode(os.environ["GMAIL_TOKEN_B64"])
          with open(os.path.expanduser("~/gmail_token.pickle"), "wb") as f:
              f.write(data)
          PY
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}

      - name: Decide what to run
        id: choose
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "script=${{ github.event.inputs.script }}" >> "$GITHUB_OUTPUT"
          else
            # Cron fires the full morning bundle: WHOOP write + unified brief
            echo "script=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run WHOOP daily (writes to sheets)
        if: steps.choose.outputs.script == 'whoop' || steps.choose.outputs.script == 'all'
        env:
          WHOOP_CREDENTIALS_B64: ${{ secrets.WHOOP_CREDENTIALS_B64 }}
          WHOOP_TOKENS_B64:      ${{ secrets.WHOOP_TOKENS_B64 }}
          SHEETS_TOKEN_B64:      ${{ secrets.SHEETS_TOKEN_B64 }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH=. python health/whoop_daily.py

      - name: Run morning brief (unified email)
        if: steps.choose.outputs.script == 'morning_brief' || steps.choose.outputs.script == 'all'
        env:
          EMAIL_FROM:            ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:              ${{ secrets.EMAIL_TO }}
          WHOOP_CREDENTIALS_B64: ${{ secrets.WHOOP_CREDENTIALS_B64 }}
          WHOOP_TOKENS_B64:      ${{ secrets.WHOOP_TOKENS_B64 }}
          SHEETS_TOKEN_B64:      ${{ secrets.SHEETS_TOKEN_B64 }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH=. python health/morning_brief.py

      - name: Run LinkedIn briefing (legacy standalone — manual only)
        if: steps.choose.outputs.script == 'linkedin'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: |
          cd "${{ github.workspace }}"
          PYTHONPATH=. python -c "import sys; sys.path.insert(0,'health'); import linkedin_briefing; linkedin_briefing.send_briefing()"

      - name: Healthcheck ping
        if: success() && env.HEALTHCHECK_PERSONAL_URL != ''
        env:
          HEALTHCHECK_PERSONAL_URL: ${{ secrets.HEALTHCHECK_PERSONAL_URL }}
        run: curl -fsS --retry 3 -o /dev/null "$HEALTHCHECK_PERSONAL_URL" || echo "ping failed (non-fatal)"
