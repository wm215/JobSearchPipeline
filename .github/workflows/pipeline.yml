name: Job Search Pipeline

on:
  schedule:
    # Times are UTC. EDT = UTC-4.
    # Pipeline (job scan) — every 2h, 12:00–24:00 UTC = 8 AM – 8 PM EDT
    - cron: "0 12,14,16,18,20,22,0 * * *"
    # Nightly tracker — 1:00 UTC = 9:00 PM EDT (previous day)
    - cron: "0 1 * * *"
    # NOTE: morning digest (7:30 AM) and followups (8 AM) are DISABLED here.
    # Both are now consolidated into the unified morning brief which runs
    # from .github/workflows/personal.yml at 7:30 AM. Manual dispatch of
    # 'digest' or 'followups' modes still works for ad-hoc runs.
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode to run"
        required: true
        default: "pipeline"
        type: choice
        options: [pipeline, digest, followups, nightly, all]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite DB from cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/job_pipeline.db
          # Cache key includes month so we get a fresh DB each month if needed
          key: job-db-${{ github.run_id }}
          restore-keys: |
            job-db-

      - name: Restore Gmail OAuth token from secret
        run: |
          python - <<'PY'
          import base64, os
          data = base64.b64decode(os.environ["GMAIL_TOKEN_B64"])
          path = os.path.expanduser("~/gmail_token.pickle")
          with open(path, "wb") as f:
              f.write(data)
          print(f"Wrote {len(data)} bytes to {path}")
          PY
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}

      - name: Determine mode (cron vs manual)
        id: mode
        run: |
          # workflow_dispatch passes a chosen mode; cron decides by WHICH
          # schedule triggered it. github.event.schedule holds the exact cron
          # string, so we key off the trigger, not the wall clock. This is
          # robust to GitHub's scheduler delays, which routinely push a
          # 01:00 UTC run past 01:59 and previously made it skip nightly mode.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 1 * * *" ]]; then
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pipeline" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline mode
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.EMAIL_FROM }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          python run.py --mode ${{ steps.mode.outputs.mode }}

      - name: Export opportunities snapshot for dashboard
        run: python export_opportunities.py

      - name: Push opportunities snapshot to repo
        run: |
          git config user.name "job-pipeline-bot"
          git config user.email "actions@github.com"
          if [ -f data/latest_opportunities.json ]; then
            git add data/latest_opportunities.json
            if ! git diff --cached --quiet; then
              git commit -m "Update opportunities snapshot [skip ci]"
              git push
            else
              echo "No changes to opportunities snapshot."
            fi
          else
            echo "No opportunities snapshot produced this run."
          fi

      - name: Save DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/job_pipeline.db
          key: job-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload pipeline log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: data/pipeline.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Healthcheck ping
        if: success() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          curl -fsS --retry 3 -o /dev/null "$HEALTHCHECK_URL" || echo "healthcheck ping failed (non-fatal)"
